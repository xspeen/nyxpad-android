name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore CI signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NYXPAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nyxpad-release.jks"
            echo "Restored the NyxPad CI signing key."
          else
            echo "No signing key secret found; the debug APK fallback will be used."
          fi

      - name: Build with Gradle
        id: build
        env:
          NYXPAD_KEYSTORE_PATH: ${{ runner.temp }}/nyxpad-release.jks
          NYXPAD_KEYSTORE_PASSWORD: ${{ secrets.NYXPAD_KEYSTORE_PASSWORD }}
          NYXPAD_KEY_ALIAS: ${{ secrets.NYXPAD_KEY_ALIAS }}
          NYXPAD_KEY_PASSWORD: ${{ secrets.NYXPAD_KEY_PASSWORD }}
        run: |
          if [ -f "$NYXPAD_KEYSTORE_PATH" ] && [ -n "$NYXPAD_KEYSTORE_PASSWORD" ]; then
            ./gradlew --no-daemon --stacktrace assembleRelease
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            ./gradlew --no-daemon --stacktrace assembleDebug
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nyxpad-apk
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp "${{ steps.build.outputs.apk_path }}" "NyxPad-${GITHUB_REF_NAME}.apk"

      - name: Publish APK on tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NyxPad-${{ github.ref_name }}.apk
          generate_release_notes: true
